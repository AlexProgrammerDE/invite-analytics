services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: invite_analytics
      POSTGRES_USER: invitebot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invitebot -d invite_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://invitebot:${POSTGRES_PASSWORD:-changeme}@postgres:5432/invite_analytics
      REDIS_URL: redis://redis:6379

volumes:
  pgdata:

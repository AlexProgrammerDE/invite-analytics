min_version: 1.13.6

pre-commit:
  commands:
    whitespace:
      run: git diff --cached --check
    rustfmt:
      glob: "{*.rs,Cargo.toml,rust-toolchain.toml,rustfmt.toml,.rustfmt.toml}"
      run: cargo fmt --all --check
      files: git diff --cached --name-only --diff-filter=ACMR

commit-msg:
  commands:
    conventional-commit:
      run: |
        if ! head -n 1 "{1}" | grep -Eq '^(Merge |Revert "|fixup! |squash! |amend! |(feat|fix|docs|refactor|test|chore|ci|build|perf|style|revert)(\([^()]+\))?!?: [^[:space:]].*$)'; then
          printf '%s\n' 'Use a Conventional Commit subject, for example: fix(db): handle duplicate invites.' >&2
          exit 1
        fi

pre-push:
  commands:
    clippy:
      run: cargo clippy --all-targets --all-features --locked -- -D warnings
      files: git diff --name-only @{upstream} HEAD
      glob: "{*.rs,Cargo.toml,Cargo.lock,clippy.toml,.clippy.toml,rust-toolchain.toml,.cargo/config,.cargo/config.toml,migrations/*.sql}"

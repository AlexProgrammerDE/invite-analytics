[package]
name = "invite-analytics"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
description = "Discord invite tracking and analytics bot"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.42", features = ["serde"] }
csv = "1.4.0"
dashmap = "6.1.0"
dotenvy = "0.15.7"
futures = "0.3.31"
image = { version = "0.25.10", default-features = false, features = ["png"] }
plotters = { version = "0.3.7", default-features = false, features = ["ab_glyph", "bitmap_backend"] }
poise = "0.6.2"
redis = { version = "1.4.1", default-features = false, features = ["connection-manager", "tokio-rustls-comp"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "derive", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
ttf-noto-sans = { version = "0.1.2", default-features = false, features = ["bold", "regular"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

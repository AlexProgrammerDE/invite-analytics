[package]
name = "invite-analytics"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
description = "Discord invite tracking and analytics bot"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.42", features = ["serde"] }
csv = "1.4.0"
dashmap = "6.1.0"
dotenvy = "0.15.7"
futures = "0.3.31"
image = { version = "0.25.10", default-features = false, features = ["png"] }
plotters = { version = "0.3.7", default-features = false, features = ["ab_glyph", "bitmap_backend"] }
poise = "0.7.0"
redis = { version = "1.4.1", default-features = false, features = ["connection-manager", "tokio-rustls-comp"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "derive", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
ttf-noto-sans = { version = "0.1.2", default-features = false, features = ["bold", "regular"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"
unit_bindings = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_const_for_fn = "allow"
option_if_let_else = "allow"
future_not_send = "allow"
redundant_pub_crate = "allow" # Conflicts with rustc unreachable_pub.
suboptimal_flops = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
map_err_ignore = "warn"
unused_result_ok = "warn"
redundant_clone = "warn"

# Safety and correctness
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
string_slice = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
exit = "warn"
rc_buffer = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
try_err = "warn"
rest_pat_in_fully_bound_structs = "warn"
iter_over_hash_type = "warn"
let_underscore_must_use = "warn"
significant_drop_tightening = "warn"

# Better test failures
assertions_on_result_states = "warn"
missing_assert_message = "warn"

# Additional correctness and style checks
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
panic_in_result_fn = "warn"
unreachable = "warn"
clone_on_ref_ptr = "warn"
wildcard_enum_match_arm = "warn"
format_push_string = "warn"
empty_structs_with_brackets = "warn"
empty_enum_variants_with_brackets = "warn"
